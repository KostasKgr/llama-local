version: '3'

# Keep parallel verification output readable.
output: group

tasks:
  agent:verify:
    desc: Run the verification checks expected by AGENTS.md.
    # Dependencies run in parallel.
    deps:
      - compile
      - shell-syntax
      - profile-config
    # Commands run after dependencies complete.
    cmds:
      - task: test

  test:
    cmds:
      - python3 -m unittest discover -s tests -v

  compile:
    cmds:
      - python3 -m compileall -q llama.py lib experiments tests

  shell-syntax:
    cmds:
      - bash -n start_swift15_iq3s_128k.sh start_bolt35.sh

  profile-config:
    desc: Validate the Strata CLI and optional proxy configuration without starting processes.
    cmds:
      - python3 llama.py start gyros --dry-run > /dev/null
      - python3 llama.py swap config --profiles bolt35 swift15 gyros > /dev/null
